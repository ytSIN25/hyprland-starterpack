general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =
    path = @WALLPAPER@

    blur_passes = 0
    blur_size = 1

    brightness = 1.0
    contrast = 1.0
    vibrancy = 0.0
}

# ============================================================
# DATE
# ============================================================

label {
    monitor =

    text = cmd[update:60000] date "+%a %b %-d"

    font_family = Inter Bold
    font_size = 21

    color = rgba(255, 255, 255, 0.82)

    text_align = center

    position = 0, 380

    halign = center
    valign = center

    shadow_passes = 4
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 1.0
}

# ============================================================
# TIME
# ============================================================

label {
    monitor =

    text = cmd[update:1000] date "+%-I:%M"

    font_family = Inter Bold
    font_size = 112

    color = rgba(255, 255, 255, 0.78)

    text_align = center

    position = 0, 275

    halign = center
    valign = center

    shadow_passes = 5
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 1.0
}

# ============================================================
# AVATAR
# ============================================================

image {
    monitor =

    path = @HOME@/.face

    size = 58

    position = 0, -425

    halign = center
    valign = center

    rounding = -1

    border_size = 2
    border_color = rgba(255, 255, 255, 0.55)

    shadow_passes = 4
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    shadow_boost = 1.0
}

# ============================================================
# USER / PASSWORD
#
# EMPTY:
#       @USER@
#
# TYPING:
#       [ ••••••••• ]
#
# The username is the placeholder, so it disappears
# automatically when password input begins.
# ============================================================

input-field {
    monitor =

    size = 240, 42

    position = 0, -475

    halign = center
    valign = center

    outline_thickness = 2

    outer_color = rgba(255, 255, 255, 0.60)
    inner_color = rgba(255, 255, 255, 0.10)

    font_color = rgba(255, 255, 255, 0.95)

    rounding = 21

    dots_size = 0.24
    dots_spacing = 0.15
    dots_center = true

    placeholder_text = $USER

    fade_on_empty = true
    fade_timeout = 0

    shadow_passes = 4
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.30)
    shadow_boost = 1.0
}

# ============================================================
# TOUCH ID / PASSWORD
# ============================================================

label {
    monitor =

    text = Touch ID or Enter Password

    font_family = Inter
    font_size = 12

    color = rgba(255, 255, 255, 0.72)

    text_align = center

    position = 0, -510

    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.30)
    shadow_boost = 1.0
}