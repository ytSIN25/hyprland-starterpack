# Starship prompt for root (sudo su / sudo -i / sudo -s): a copy of
# ~/.config/starship.toml where only the "root" name is red.
# Installed root-owned to /etc/starship-root.toml by install-root-prompt.sh
# (root must never read a config the normal user can edit).
palette = "quickshell"
# Disable the blank line before the prompt
add_newline = false

# Custom layout definition
format = """
╭─$username$hostname $directory
╰─$character"""

[username]
show_always = true
style_user = "bold #ff8a8a"
style_root = "bold #ff8a8a"
# Hardcoded: `su` keeps USER=playera in the environment
format = "[root]($style)"

[hostname]
ssh_only = false
style = "bold purple"
format = "[@$hostname]($style)"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style)"

[character]
success_symbol = "[➤ ](bold #ffffff)"

# >>> QUICKSHELL STARSHIP PALETTE >>>
