<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Generated by Quickshell Settings (Typography) — do not edit by hand. -->
<fontconfig>
  <!-- Preferred family = the one chosen in Typography (with fallbacks). -->
  <alias><family>sans-serif</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Noto Sans Mono</family></prefer></alias>
  <!-- Rendering: RGB subpixel + slight hinting, no embedded bitmaps. -->
  <match target="font">
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="hinting"        mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"           mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"      mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
